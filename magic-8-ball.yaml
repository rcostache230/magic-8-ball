# Magic 8 Ball on a Waveshare ESP32-S3-Touch-AMOLED-1.75 (466 x 466 round AMOLED).
#
# Ask a question, then shake it (or hold it face down and turn it over, or tap the screen).
# The ball turns to its liquid window, bubbles rise and an answer surfaces.
# Rarity tiers: blue (common), purple RARE, gold LEGENDARY, cyan GLITCH, green SECRET.
#
# The look and behaviour live in magic8.h; the answers in answers.txt (run
# tools/make_assets.py after editing them); the art is generated by the same script.
#
# Board facts (Waveshare HARDWARE_REFERENCE.md, cross-checked on this board):
#   AMOLED CO5300  QSPI CLK GPIO38, D0-D3 GPIO4-7, CS GPIO12, RST GPIO39 (ESPHome model has them)
#   Shared I2C     SDA GPIO15, SCL GPIO14: CST9217 touch 0x5A, QMI8658 IMU 0x6B, AXP2101 0x34,
#                  PCF85063 RTC 0x51, TCA9554 expander 0x20, ES8311 0x18, ES7210 0x40
#   Touch          INT GPIO11, RST GPIO40      BOOT button GPIO0 (low when pressed)
#
#   esphome run magic-8-ball.yaml                                  # USB
#   esphome run magic-8-ball.yaml --device magic-8-ball.local      # over Wi-Fi afterwards

packages:
  die: !include die_frames.yaml   # generated: the tumbling-die frames

substitutions:
  name: magic-8-ball
  friendly_name: Magic 8 Ball
  timezone: Europe/Bucharest   # tz database name: night volume and the late-night easter egg use it

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - answers_gen.h
    - assets_gen.h
    - magic8.h
  on_boot:
    # Before anything else: deep sleep holds the panel and touch reset lines low; let go of
    # them before the display and touch drivers try to reset those chips.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_39);
            gpio_hold_dis(GPIO_NUM_40);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_deep_sleep_hold_dis();
    - priority: -200
      then:
        - delay: 8s   # repeated once Wi-Fi logging is up
        - lambda: |-
            ESP_LOGI("m8", "Woke by %s", esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0 ? "motion" : "power-on or reset");
    - priority: -100
      then:
      - lambda: |-
          auto &e = m8::engine();
          e.set_brightness_fn([](uint8_t b) { id(amoled).set_brightness(b); });
          e.set_hour_fn([]() -> int {
            auto t = id(sntp_time).now();
            return t.is_valid() ? (int) t.hour : -1;
          });
          // The die frames come from die_frames.yaml; M8_DIE_FRAMES lists their ids.
          #define M8_DSC(n) n->get_lv_image_dsc(),
          static const lv_image_dsc_t *die_frames[] = {M8_DIE_FRAMES(M8_DSC)};
          e.set_die_frames(die_frames, m8::DIE_N);
          // Modes (double-tap): the stored one, and the 8 disc for the normal and Roast looks.
          e.set_mode(id(ball_mode));
          e.set_mode_store_fn([](int m) { id(ball_mode) = m; });
          e.set_disc_images(img_disc->get_lv_image_dsc(), img_disc_roast->get_lv_image_dsc());
          // The rickroll player: frames through LVGL, audio through the media player.
          id(video).attach(lv_obj_get_parent(id(w_window)));
          id(video).set_audio_fns(
              [](audio::AudioFile *f) {
                id(amp).turn_on();
                id(sfx).play_file(f, true, false);
              },
              []() {
                if (id(sfx).state != media_player::MEDIA_PLAYER_STATE_IDLE)
                  id(sfx).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_STOP).perform();
              },
              []() { return id(sfx).state != media_player::MEDIA_PLAYER_STATE_IDLE; });
          m8::Engine::VideoFns vf;
          vf.available = []() { return id(sd).mounted() && id(video).available(); };
          vf.prepare = [](bool sound) { id(video).prepare(sound); };
          vf.state = []() { return id(video).prep_state(); };
          vf.start = []() { id(video).start(); };
          vf.stop = []() { id(video).stop(); };
          vf.done = []() { return id(video).done(); };
          e.set_video(vf);
          // USB test hooks for tools/sdcard.py: "#M8 RIG 4", "#M8 ASK"
          id(sd).set_command_fn([](const std::string &verb, const std::string &arg) -> bool {
            if (verb == "RIG") { m8::engine().rig(atoi(arg.c_str())); return true; }
            if (verb == "ASK") { m8::engine().ask(-1, -1); return true; }
            return false;
          });
          e.begin(id(w_window), id(w_sphere), id(w_disc), id(w_spec), id(w_die), id(w_tri_blue),
                  id(w_tri_purple), id(w_tri_gold), id(w_tri_red), id(w_tri_skill), id(w_answer), id(w_answer_sm),
                  id(w_pill));
          id(imu).add_listener([](motion::MotionData &d) {
            m8::engine().on_accel(d.acceleration[0], d.acceleration[1], d.acceleration[2]);
          });
          e.set_battery_label(id(w_batt));
          // Sounds: order = the Snd enum in magic8.h. Quieter from 22:00 to 07:00.
          e.set_sound_enabled(id(sound_enabled));
          e.set_sound_store_fn([](bool on) { id(sound_enabled) = on; });
          e.set_sound_fn([](int snd, bool enqueue) {
            static audio::AudioFile *const SOUNDS[] = {id(snd_turnover), id(snd_bubbles), id(snd_reveal_common), id(snd_reveal_rare), id(snd_reveal_legendary), id(snd_reveal_glitch), id(snd_reveal_secret), id(snd_sink), id(snd_wake), id(snd_charge), id(snd_low_battery), id(snd_sound_on), id(snd_rimshot), id(snd_mode_switch), id(snd_skill_issue)};
            auto t = id(sntp_time).now();
            bool night = t.is_valid() && (t.hour >= 22 || t.hour < 7);
            float volume = night ? 0.35f : 0.75f;
            if (fabsf(id(sfx).volume - volume) > 0.01f)
              id(sfx).make_call().set_volume(volume).perform();
            id(amp).turn_on();   // the NS4150B; switched off again when the player goes idle
            id(sfx).play_file(SOUNDS[snd], true, enqueue);
          });
          e.set_sleep_fn([]() { id(go_to_sleep).execute(); });
          e.set_poweroff_fn([]() { id(power).power_off(); });

external_components:
  - source:
      type: local
      path: components
    components: [m8power, m8sd, m8video]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # LVGL reads the big images on every frame. Copying code and read-only data (the
      # images) into octal PSRAM at boot is far faster than reading them from flash, and a
      # bigger data cache helps the software rotate/scale.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    display.mipi_spi: INFO   # every brightness step logs MADCTL at DEBUG
    lvgl: INFO
    sensor: INFO
    m8.imu: INFO             # the raw tilt readout, every 2 s, is only for calibration

# Wi-Fi is only for updates and logs. No fallback hotspot (an open setup AP is the main
# exposure on these boards), and no reboot when the network is out of reach: it's a toy
# that leaves the house.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  actions:
    - action: ask
      then:
        - lambda: m8::engine().ask(-1, -1);
    - action: ask_rarity       # 0 common, 1 rare, 2 legendary, 3 glitch, 4 secret, 5 classic, 6 roast
      variables:
        rarity: int
      then:
        - lambda: m8::engine().ask(rarity, -1);
    - action: rig              # test: rig the next answer: 0 cancel, 1 SKILL ISSUE, 2 yes, 3 no
      variables:
        what: int
      then:
        - lambda: m8::engine().rig(what);
    - action: play_sound       # test: play one sound (index = the Snd enum in magic8.h)
      variables:
        index: int
      then:
        - lambda: m8::engine().play(index);
    - action: sleep_now        # test: deep sleep immediately; moving the ball should wake it
      then:
        - lambda: m8::engine().sleep_now();
    - action: wom_test         # diagnostic: watch the wake-on-motion line for 30 s
      variables:
        odr: int                 # 12 = 128 Hz, 13 = 21 Hz, 14 = 11 Hz, 15 = 3 Hz (low power; 3 Hz missed pick-ups)
        mg: int                  # threshold
      then:
        - lambda: |-
            id(imu).stop_poller();     // nothing else talks to the IMU, as in deep sleep
            id(power).start_wom_test(30000, odr, mg);
        - delay: 31s
        - lambda: |-
            id(imu).setup();           // back to normal IMU mode
            id(imu).start_poller();
    - action: power_report     # logs the charger registers and battery state
      then:
        - lambda: id(power).report();
    - action: ask_index        # an index into answers_gen.h
      variables:
        index: int
      then:
        - lambda: m8::engine().ask(-1, index);

ota:
  - platform: esphome
    password: !secret ota_password

# Battery: AXP2101 charger set to 4.2 V / 500 mA (gentle for a 3000 mAh LP103665 in a
# closed shell, about 6-7 h to full), plus wake-on-motion for deep sleep.
m8power:
  id: power
  i2c_id: i2c_bus
  charge_current: 500
  wake_threshold: 50      # mg change between 11 Hz samples that wakes it (tested by hand)
  update_interval: 2s

# microSD card (FAT32), mounted at /sd. Manage it over USB with tools/sdcard.py.
m8sd:
  id: sd

# The Roast-mode rickroll (swipe down, then shake), played from the SD card.
m8video:
  id: video

# Only entered on battery, from magic8.h (or the sleep_now test action). The IMU's
# wake-on-motion line (INT2, GPIO21) toggles on every movement; go_to_sleep parks it high
# first, so the next movement pulls it low. INVERT_WAKEUP is the fallback if it moved anyway.
deep_sleep:
  id: deep_sleep_ctl
  wakeup_pin:
    number: GPIO21
    inverted: true
  wakeup_pin_mode: INVERT_WAKEUP

# ---------------------------------------------------------------------------------------
# Sound: ES8311 codec (I2S slave, MCLK from the ESP32) into an NS4150B amplifier and the
# speaker on the SPK connector. Pins and the amp's active-high enable (GPIO46) are from
# Waveshare's BSP. The sounds are original, made by tools/make_sounds.py.
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO42

audio_dac:
  - platform: es8311
    id: codec
    i2c_id: i2c_bus
    bits_per_sample: 16bit
    sample_rate: 22050
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO8
    audio_dac: codec
    sample_rate: 22050
    bits_per_sample: 16bit
    channel: mono

output:
  - platform: gpio
    id: amp
    pin:
      number: GPIO46
      ignore_strapping_warning: true

media_player:
  - platform: speaker
    id: sfx
    internal: true
    buffer_size: 131072
    volume_initial: 0.75
    announcement_pipeline:
      speaker: spk
      format: WAV
      sample_rate: 22050
      num_channels: 1
    on_idle:
      - output.turn_off: amp
    files:
      - id: snd_turnover
        file: sounds/turnover.wav
      - id: snd_bubbles
        file: sounds/bubbles.wav
      - id: snd_reveal_common
        file: sounds/reveal_common.wav
      - id: snd_reveal_rare
        file: sounds/reveal_rare.wav
      - id: snd_reveal_legendary
        file: sounds/reveal_legendary.wav
      - id: snd_reveal_glitch
        file: sounds/reveal_glitch.wav
      - id: snd_reveal_secret
        file: sounds/reveal_secret.wav
      - id: snd_sink
        file: sounds/sink.wav
      - id: snd_wake
        file: sounds/wake.wav
      - id: snd_charge
        file: sounds/charge.wav
      - id: snd_low_battery
        file: sounds/low_battery.wav
      - id: snd_sound_on
        file: sounds/sound_on.wav
      - id: snd_rimshot
        file: sounds/rimshot.wav
      - id: snd_mode_switch
        file: sounds/mode_switch.wav
      - id: snd_skill_issue
        file: sounds/skill_issue.wav

globals:
  - id: ball_mode            # 0 Oracle, 1 Classic, 2 Roast; double-tap to switch; remembered
    type: int
    restore_value: true
    initial_value: "0"
  - id: sound_enabled        # long-press the screen to toggle; survives sleep and power-off
    type: bool
    restore_value: true
    initial_value: "true"

script:
  - id: go_to_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: return id(power).arm_wake_on_motion();
          then:
            # Let the WoM blanking period pass, then clear any event so the line sits at its
            # initial (high) level.
            - delay: 1200ms
            - lambda: |-
                int level = id(power).clear_wake_event();
                ESP_LOGI("m8", "Sleeping; wake line %s", level ? "high, waiting for movement" : "LOW (inverting)");
                id(sd).unmount();
                // The panel and touch controller draw least while held in reset.
                gpio_set_level(GPIO_NUM_39, 0);
                gpio_hold_en(GPIO_NUM_39);
                gpio_set_level(GPIO_NUM_40, 0);
                gpio_hold_en(GPIO_NUM_40);
                gpio_set_level(GPIO_NUM_46, 0);   // amplifier off (GPIO46 has no pull of its own)
                gpio_hold_en(GPIO_NUM_46);
                gpio_deep_sleep_hold_en();
                id(deep_sleep_ctl).begin_sleep(true);
          else:
            - logger.log:
                level: ERROR
                format: "Wake-on-motion could not be armed: staying awake rather than sleeping for good"

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

i2c:
  id: i2c_bus
  sda: GPIO15
  scl: GPIO14
  frequency: 400kHz

spi:
  id: qspi
  type: quad
  clk_pin: GPIO38
  data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

display:
  - platform: mipi_spi
    id: amoled
    model: WAVESHARE-ESP32-S3-TOUCH-AMOLED-1.75
    spi_id: qspi
    data_rate: 80MHz
    draw_rounding: 2       # the CO5300 needs even window coordinates
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst9220      # also drives the CST9217 on this board
    id: touch
    display: amoled
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    # A deliberate tap asks; a finger resting on the glass while holding it doesn't.
    on_touch:
      - lambda: m8::engine().touch_down(touch.x, touch.y);
    on_update:
      - lambda: |-
          if (!touches.empty())
            m8::engine().touch_move(touches[0].x, touches[0].y);
    on_release:
      - lambda: m8::engine().touch_up();

motion:
  - platform: qmi8658
    id: imu
    i2c_id: i2c_bus
    # The QMI8658 sits rotated 180 degrees about the screen's vertical axis. Measured on
    # this board: right edge down reads +x, bottom edge down reads -y, screen up reads -z.
    # Mapped so x = screen right, y = screen down, z = out of the screen.
    axis_map:
      x: -x
      y: y
      z: -z
    accelerometer_range: 8G      # a kid's shake easily passes 4 g
    accelerometer_odr: 250HZ
    update_interval: 20ms

binary_sensor:
  - platform: template
    name: Charging
    device_class: battery_charging
    lambda: return id(power).charging();
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    on_press:
      - lambda: m8::engine().on_button();

interval:
  - interval: 16ms
    then:
      - lambda: m8::engine().tick();
  - interval: 2s
    then:
      - lambda: |-
          auto *p = id(power);
          if (!p->is_failed())
            m8::engine().set_power(p->battery_present(), p->usb_power(), p->charging(), p->charge_state(),
                                   p->battery_percent(), p->battery_mv());

# For Home Assistant, if you add the device there.
sensor:
  - platform: template
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      int p = id(power).battery_percent();
      return p < 0 ? NAN : (float) p;
  - platform: template
    name: Battery voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      return id(power).battery_present() ? id(power).battery_mv() / 1000.0f : NAN;

image:
  - platform: file
    file: assets/sphere.png
    id: img_sphere
    type: RGB565
  - platform: file
    file: assets/window.png
    id: img_window
    type: RGB565
  - platform: file
    file: assets/disc8.png
    id: img_disc
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/spec.png
    id: img_spec
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/tri_blue.png
    id: img_tri_blue
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/tri_purple.png
    id: img_tri_purple
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/tri_gold.png
    id: img_tri_gold
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/tri_red.png
    id: img_tri_red
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/tri_skill.png
    id: img_tri_skill
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: assets/disc8_roast.png
    id: img_disc_roast
    type: RGB565
    transparency: alpha_channel

# Sizes must match ANSWER_SIZES in tools/make_assets.py, which checks every answer fits.
font:
  - file: fonts/BarlowCondensed-SemiBold.ttf
    id: f_answer
    size: 34
    bpp: 4
    glyphs: " !'()+,-./0123456789:?%ABCDEFGHIJKLMNOPQRSTUVWXYZÉ…"
  - file: fonts/BarlowCondensed-SemiBold.ttf
    id: f_answer_sm
    size: 29
    bpp: 4
    glyphs: " !'()+,-./0123456789:?%ABCDEFGHIJKLMNOPQRSTUVWXYZÉ…"
  - file: fonts/BarlowCondensed-Bold.ttf
    id: f_pill
    size: 17
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%/ "

lvgl:
  displays:
    - amoled
  color_depth: 16
  buffer_size: 12%        # small enough to live in internal RAM: much faster than PSRAM
  bg_color: 0x000000
  bg_opa: COVER
  widgets:
    # Bottom to top. magic8.h inserts the bubbles between the die and the triangles and
    # puts the legendary sparkles on top.
    - image: { id: w_window, src: img_window, align: CENTER, hidden: true }
    - image: { id: w_sphere, src: img_sphere, align: CENTER }
    - image: { id: w_disc, src: img_disc, align: CENTER }
    - image: { id: w_spec, src: img_spec, align: CENTER }
    - label:                # battery status on the idle ball (magic8.h decides when)
        id: w_batt
        hidden: true
        align: CENTER
        y: 166
        text: ""
        text_font: f_pill
        text_color: 0xFFFFFF
        text_letter_space: 4
        bg_opa: TRANSP
        border_width: 1
        border_color: 0xFFFFFF
        radius: 14
        pad_left: 12
        pad_right: 8
        pad_top: 3
        pad_bottom: 3
    - image: { id: w_die, src: img_die_00, align: CENTER, hidden: true }
    - image: { id: w_tri_blue, src: img_tri_blue, align: CENTER, hidden: true }
    - image: { id: w_tri_purple, src: img_tri_purple, align: CENTER, hidden: true }
    - image: { id: w_tri_gold, src: img_tri_gold, align: CENTER, hidden: true }
    - image: { id: w_tri_red, src: img_tri_red, align: CENTER, hidden: true }
    - image: { id: w_tri_skill, src: img_tri_skill, align: CENTER, hidden: true }
    - label:
        id: w_answer
        hidden: true
        align: CENTER
        width: 300
        text: ""
        text_font: f_answer
        text_color: 0xFFFFFF
        text_align: CENTER
    - label:
        id: w_answer_sm
        hidden: true
        align: CENTER
        width: 300
        text: ""
        text_font: f_answer_sm
        text_color: 0xFFFFFF
        text_align: CENTER
    - label:
        id: w_pill
        hidden: true
        align: CENTER
        text: ""
        text_font: f_pill
        text_color: 0xFFFFFF
        text_letter_space: 5
        bg_opa: TRANSP
        border_width: 1
        border_color: 0xFFFFFF
        radius: 14
        pad_left: 14
        pad_right: 9       # letter spacing already trails the last letter
        pad_top: 3
        pad_bottom: 3
